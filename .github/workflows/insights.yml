name: 성과 조회

on:
  schedule:
    - cron: "0 14 * * *"   # 매일 23:00 (한국)
  push:
    branches: [main]
    paths: ["insights.py", ".github/workflows/insights.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: true

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 성과 읽기
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python insights.py
      - name: 결과 저장
        run: |
          if [ -n "$(git status --porcelain insights.csv)" ]; then
            git config user.name  "auto-post"
            git config user.email "auto-post@users.noreply.github.com"
            git add insights.csv
            git commit -m "성과 기록 $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
            git pull --rebase --autostash || true
            git push
          fi
